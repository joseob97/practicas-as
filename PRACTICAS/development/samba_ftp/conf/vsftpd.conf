listen=YES
listen_ipv6=NO

# Solo acceso anonimo, sun usuario local
anonymous_enable=YES
local_enable=NO
write_enable=NO

# Raiz para el usuario anonymous
anon_root=/data/publico
anon_world_readable_only=YES
anon_umask=022

# Seguridad minima: solo FTP basico
chroot_local_user=NO
allow_writeable_chroot=NO

# No cifrado
ssl_enable=NO

# Modo pasivo
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40010

# Otros ajustes
dirmessage_enable=NO
use_localtime=YES
xferlog_enable=NO