[global]
   workgroup = WORKGROUP
   security = user
   map to guest = Bad User
   server string = Samba Server
   log file = /var/log/samba/log.%m
   max log size = 50
   dns proxy = no

[desarrollo]
   path = /data/desarrollo
   browseable = yes
   read only = no
   create mask = 0770
   directory mask = 0770
   valid users = empleado1 empleado2 empleado3 empleado4 empleado5
   force user = %U

[revision]
   path = /data/revision
   browseable = yes
   read only = no
   create mask = 0770
   directory mask = 0770
   valid users = revisor
   force group = revisor

[revision1]
   path = /data/revision/SW1
   browseable = yes
   read only = no
   create mask = 0770
   directory mask = 0770
   valid users = empleado1 revisor
   force group = revisor

