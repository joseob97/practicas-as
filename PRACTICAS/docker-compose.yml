#----------------------------CONTENEDORES-------------------------------#

services:

  # Bloque NAS + DNS Server
  nas_dns:
    image: debian:latest
    container_name: nas_serv
    restart: always
    command: bash ./backups/inicio.sh
    environment:
      MYSQL_ROOT_PASSWORD: password
      POSTGRES_PASSWORD: password
    volumes:
      - ./nas_data/backups:/backups
    dns:
      - 172.20.0.6
    networks:
      services_net:
        ipv4_address: 172.20.0.10
    tty: true

  bind9:
    image: internetsystemsconsortium/bind9:9.20
    container_name: bind9_serv
    restart: always
    dns:
      - 172.20.0.6
    volumes:
      - ./bind/config:/etc/bind
      - ./bind/config/zones:/etc/bind/zones
      - dns_cache:/var/cache/bind
      - dns_logs:/var/log
    environment:
      - TZ=Europe/Madrid
    networks:
      services_net:
        ipv4_address: 172.20.0.6


  # Bloque PostgreSQL y Nginx
  postgresql:
    image: 'bitnami/postgres:latest'
    container_name: postgresql
    restart: always
    volumes:
      - postgre_data:/bitnami/postgresql
    environment:
      POSTGRESQL_DATABASE: drupal
      POSTGRESQL_USERNAME: drupal
      POSTGRESQL_PASSWORD: password
    dns:
      - 172.20.0.6
    networks:
      production_net:
        ipv4_address: 172.30.0.7

  nginx:
    image: 'bitnami/nginx:latest'
    container_name: nginx_prod
    restart: always
    volumes:
      - ./production/server-block.conf:/opt/bitnami/nginx/conf/server_blocks/server-block.conf
      - prod_data:/app
    ports:
      - "8081:80"
    dns:
      - 172.20.0.6
    networks:
      production_net:
        ipv4_address: 172.30.0.5
    depends_on:
      - postgresql

  phpfm:
    image: 'bitnami/php-fpm:latest'
    container_name: phpfm
    restart: always
    entrypoint: bash /iniciodrupal.sh
    volumes:
      - ./production/iniciondrupal.sh:/iniciodrupal.sh
      - ./production/php.ini:/opt/bitnami/php/etc/php.ini
      - prod_data:/app
    environment:
      - PHP_ENABLE_OPCACHE=1
    dns:
      - 172.20.0.6
    networks:
      production_net:
        ipv4_address: 172.30.0.6
    depends_on:
      - postgresql



  # Bloque Apache y MySQL
  mysql:
    image: mysql:latest
    container_name: db.dev.local
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: drupal
      MYSQL_USER: drupal
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    dns:
      - 172.20.0.6
    networks:
      development_net:
        ipv4_address: 172.40.0.6


  drupal:
    image: drupal:10-apache
    container_name: dev.local
    restart: always
    volumes:
      - dev_data:/var/www/html/ 
    ports:
      - "8080:80"
    dns:
      - 172.20.0.6
    networks:
      development_net:
        ipv4_address: 172.40.0.5
    depends_on:
      - mysql

#------------------------NETWORKS--------------------#
networks:
  services_net:
    name: services_net
    driver: macvlan
    driver_opts:
      parent: ens18
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

  production_net:
    name: production_net
    driver: macvlan
    driver_opts:
      parent: ens19
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

  development_net:
    name: development_net
    driver: macvlan
    driver_opts:
      parent: ens20
    ipam:
      config:
        - subnet: 172.40.0.0/24
          gateway: 172.40.0.1


#--------------------------VOLUMENES-----------------------#
volumes:
  dev_data:
  mysql_data:
  prod_data:
  postgre_data:
  dns_cache:
  dns_logs:
  
