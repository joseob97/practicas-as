#----------------------------CONTENEDORES-------------------------------#

services:

  # Bloque NAS + DNS Server
  nas_dns:
    build:
      context: ./services/nas_data
    container_name: nas_serv
    restart: always
    cap_add:
      - NET_ADMIN
    privileged: true
    environment:
      MYSQL_ROOT_PASSWORD: password
      POSTGRES_PASSWORD: password
    volumes:
      - ./services/nas_data/backups:/backups
    dns:
      - 172.20.0.6
    networks:
      bridge_local: {}
      services_net:
        ipv4_address: 172.20.0.5
    tty: true

  bind9:
    build:
      context: ./services/bind
    container_name: bind9_serv
    restart: always
    cap_add:
      - NET_ADMIN
    dns:
      - 172.20.0.6
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - ./services/bind/config:/etc/bind
      - ./services/bind/config/zones:/etc/bind/zones
      - dns_cache:/var/cache/bind
      - dns_logs:/var/log
    environment:
      - BIND9_USER=root
    networks:
      bridge_local: {}
      services_net:
        ipv4_address: 172.20.0.6
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1

  # Bloque PostgreSQL y Nginx
  postgresql:
    build:
      context: ./production/postgre.prod
    container_name: postgresql
    restart: always
    cap_add:
      - NET_ADMIN
    volumes:
      - postgre_data:/bitnami/postgresql
    environment:
      POSTGRESQL_DATABASE: drupal
      POSTGRESQL_USERNAME: drupal
      POSTGRESQL_PASSWORD: password
    dns:
      - 172.20.0.6
    networks:
      production_net:
        ipv4_address: 172.30.0.7
      services_net:
        ipv4_address: 172.20.0.7

  nginx:
    build:
      context: ./production/nginx.prod
    container_name: nginx_prod
    restart: always
    cap_add:
      - NET_ADMIN
    volumes:
      - ./production/nginx.prod/server-block.conf:/etc/nginx/conf.d/default.conf
      - prod_data:/app
    ports:
      - "8080:80"
    dns:
      - 172.20.0.6
    networks:
      bridge_local: {}
      production_net:
        ipv4_address: 172.30.0.5
    depends_on:
      - postgresql

  drupal_prod:
    build:
      context: ./production/drupal.prod
    container_name: drupal_prod
    restart: always
    cap_add:
      - NET_ADMIN
    volumes:
      - ./production/drupal.prod/iniciodrupal.sh:/iniciodrupal.sh
      - ./production/drupal.prod/php.ini:/usr/local/etc/php/php.ini
      - prod_data:/app
    environment:
      - PHP_ENABLE_OPCACHE=1
    dns:
      - 172.20.0.6
    networks:
      bridge_local: {}
      production_net:
        ipv4_address: 172.30.0.6
    depends_on:
      - postgresql



  # Bloque Apache y MySQL
  mysql:
    build: ./development/db.dev.local
    container_name: db.dev.local
    restart: always
    cap_add:
      - NET_ADMIN
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    dns:
      - 172.20.0.6
    networks:
      development_net:
        ipv4_address: 172.40.0.6


  dev.local:
    build: ./development/dev.local
    container_name: dev.local
    restart: always
    cap_add:
      - NET_ADMIN
    volumes:
      - dev_data:/var/www/html/ 
    ports:
      - "8081:80"
    dns:
      - 172.20.0.6
    networks:
      bridge_local: {}
      development_net:
        ipv4_address: 172.40.0.5
    depends_on:
      - mysql

  # Bloque Servidores SSH
  ssh_services:
    build: ./services/ssh_services
    container_name: ssh_services
    restart: always
    cap_add:
      - NET_ADMIN
    dns:
      - 172.20.0.6
    networks:
      bridge_local: {}
      services_net:
        ipv4_address: 172.20.0.9
    ports:
      - "2222:22"
    volumes:
      - ./services/ssh_services/authorized_keys:/home/john/.ssh/authorized_keys:ro

  ssh_development:
    build: ./development/ssh_development
    container_name: ssh_development
    restart: always
    cap_add:
      - NET_ADMIN
    dns:
      - 172.20.0.6
    networks:
      bridge_local: {}
      development_net:
        ipv4_address: 172.40.0.9
    ports:
      - "2223:22"
    volumes:
      - sshdev_data:/home/john

  # Bloque Samba-FTP y servidor acceso publico
  samba_ftp:
    build: ./development/samba_ftp
    container_name: samba_ftp
    restart: always
    cap_add:
      - NET_ADMIN
    dns:
      - 172.20.0.6 
    networks:
      development_net:
        ipv4_address: 172.40.0.10
      host_access_net:
        ipv4_address: 172.40.1.10
    ports:
      - "21:21"
      - "139:139"
      - "445:445"
      - "40000-40010:40000-40010"
    volumes:
      - ./development/samba_ftp/data:/data

  sftp_gateway:
    build: ./production/sftp_gateway
    container_name: sftp_gateway
    restart: always
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    dns:
      - 172.20.0.6 
    networks:
      production_net:
        ipv4_address: 172.30.0.10
      development_net:
        ipv4_address: 172.40.0.15
      bridge_local: {}
    ports:
      - "2224:22"
    volumes:
      - ./production/sftp_gateway/sftp_data:/home/cliente/sftp_data
    depends_on:
      - samba_ftp
      
  # Bloque servidor WEB en production
  apache_web:
    build: ./production/apache_web
    container_name: apache_web
    restart: always
    cap_add:
      - NET_ADMIN
    volumes:
      - ./development/samba_ftp/data/publico:/mnt/publico:ro
    ports:
      - "8082:80"
    dns:
      - 172.20.0.6
    networks:
      bridge_local: {}
      production_net:
        ipv4_address: 172.30.0.20

  # Bloque POSTFIX-MAIL en production
  postfix_mail:
    build: ./production/postfix_mail
    container_name: postfix_mail
    restart: always
    cap_add:
      - NET_ADMIN
    dns:
      - 172.20.0.6
    networks:
      production_net:
        ipv4_address: 172.30.0.15
    ports:
      - "25:25"
      - "587:587"
    volumes:
      - ./production/postfix_mail/config:/etc/postfix

  
#------------------------NETWORKS--------------------#
networks:
  bridge_local:
    driver: bridge

  services_net:
    driver: macvlan
    driver_opts:
      parent: ens18
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

  production_net:
    driver: macvlan
    driver_opts:
      parent: ens19
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

  development_net:
    driver: macvlan
    driver_opts:
      parent: ens20
    ipam:
      config:
        - subnet: 172.40.0.0/24
          gateway: 172.40.0.1

  host_access_net:
    driver: macvlan
    driver_opts:
      parent: ens20
    ipam:
      config:
        - subnet: 172.40.1.0/24
          gateway: 172.40.1.1

#--------------------------VOLUMENES-----------------------#
volumes:
  dev_data:
  mysql_data:
  prod_data:
  postgre_data:
  dns_cache:
  dns_logs:
  sshdev_data:  
