#----------------------------CONTENEDORES-------------------------------#

version: '3.8'

services:

  # Bloque NAS + DNS Server
  nas_dns:
    image: debian:latest
    container_name: nas_serv
    restart: always
    command: bash ./backups/startup.sh
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - nas_data:/mnt/backups
      - ./backup_scripts:/scripts
      - ./dns_config:/etc/bind
    dns:
      - 172.20.0.6  
    networks:
      services_net:
        ipv4_address: 172.20.0.10
    tty: true

  bind9:
    image: internetsystemconsortium/bind9:9.20
    container_name: bind9_serv
    restart: always
    volumes:
      - ./dns_config:/etc/bind          
      - ./logs:/var/log/named           
      - ./zones:/var/lib/bind           
      - /etc/localtime:/etc/localtime:ro 
    environment:
      - TZ=Europe/Madrid
    networks:
      services_net:
        ipv4_address: 172.20.0.6


  # Bloque PostgreSQL y Nginx
  postgre:
    image: postgres:latest
    container_name: postgres_db
    restart: always
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    dns:
      - 172.20.0.6
    networks:
      production_net:
        ipv4_address: 172.30.0.7
    command: ["postgres", "-c", "shared_preload_libraries=pg_trgm"]
  
  nginx:
    image: nginx:latest
    container_name: nginx_prod
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - drupal_prod_data:/var/www/html
    ports:
      - "8081:80"
    dns:
      - 172.20.0.6
    networks:
      production_net:
        ipv4_address: 172.30.0.5
    depends_on:
      - postgre

  drupal:
    image: drupal:php8.3-fpm
    container_name: drupal_prod
    restart: always
    volumes:
      - drupal_prod_data:/var/www/html
    environment:
      DRUPAL_DB_HOST: ${DRUPAL_DB_HOST}
      DRUPAL_DB_NAME: ${DRUPAL_DB_NAME}
      DRUPAL_DB_USER: ${DRUPAL_DB_USER}
      DRUPAL_DB_PASSWORD: ${DRUPAL_DB_PASSWORD}
    ports:
      - "9000:9000"
    dns:
      - 172.20.0.6  
    networks:
      production_net:
        ipv4_address: 172.30.0.6
    depends_on:
      - postgre



  # Bloque Apache y MySQL
  mysql:
    image: mysql:latest
    container_name: db.dev.local
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    dns:
      - 172.20.0.6
    networks:
      development_net:
        ipv4_address: 172.40.0.6
  

  drupal2:
    image: drupal:php8.3-apache
    container_name: dev.local
    restart: always
    volumes:
      - drupal_dev_data:/var/www/html
    environment:
      DRUPAL_DB_HOST: ${DRUPAL2_DB_HOST}
      DRUPAL_DB_NAME: ${DRUPAL2_DB_NAME}
      DRUPAL_DB_USER: ${DRUPAL2_DB_USER}
      DRUPAL_DB_PASSWORD: ${DRUPAL2_DB_PASSWORD}
    ports:
      - "8082:80"
    dns:
      - 172.20.0.6
    networks:
      development_net:
        ipv4_address: 172.40.0.5
    depends_on:
      - mysql

#------------------------NETWORKS--------------------#
networks:
  services_net:
    driver: macvlan
    driver_opts:
      parent: ens18
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

  production_net:
    driver: macvlan
    driver_opts:
      parent: ens19
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

  development_net:
    driver: macvlan
    driver_opts:
      parent: ens20
    ipam:
      config:
        - subnet: 172.40.0.0/24
          gateway: 172.40.0.1


#--------------------------VOLUMENES-----------------------#
volumes:
  pg_data:
  drupal_prod_data:
  drupal_dev_data:
  nas_data:
  mysql_data:
